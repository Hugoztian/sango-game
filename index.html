<title>三國志 · 群雄割據</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a120b;color:#f3e6c8;font-family:"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;min-height:44px;min-width:44px;border:1px solid #8a6a3a;background:linear-gradient(#5a3a1e,#3a2412);border-radius:8px;padding:6px 12px;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.4}
button.pri{background:linear-gradient(#b0302a,#701a14);border-color:#e0b060}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#2a1a0e;border-bottom:2px solid #8a6a3a;flex-wrap:wrap}
#date{font-weight:bold;color:#ffd77a;flex:1;min-width:120px}
#main{flex:1;display:flex;position:relative;min-height:0}
#mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(#3b5a3a,#203520)}
#map{position:absolute;left:0;top:0;transform-origin:0 0}
#panel{background:#24170c;border-top:2px solid #8a6a3a;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (orientation:portrait){#main{flex-direction:column}#panel{max-height:48%;min-height:0}}
@media (orientation:landscape){#panel{width:min(380px,45%);border-top:0;border-left:2px solid #8a6a3a}}
#panel h2{margin:6px 10px;font-size:20px;color:#ffd77a;display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 10px;font-size:13px}
.stats div{background:#33210f;border-radius:6px;padding:4px;text-align:center}.stats b{display:block;color:#ffd77a;font-size:15px}
.cmds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 10px}
.cmds button{padding:4px 2px}
.olist{padding:0 10px 10px}
.orow{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid #3a2a18;font-size:13px;min-height:44px}
.orow .nm{font-weight:bold;width:64px;font-size:15px}.orow.done{opacity:.5}

function applyItem(o,it){const d=itemDef(it);if(sameStat(o,it))return false;its(o).push({n:it,b:d[2]});o[d[1]]+=d[2];return true}

function revokeItem(o,swap,name){const L=its(o);if(!L.length)return;const i=name?L.findIndex(x=>x.n==name):L.length-1;if(i<0)return;const x=L.splice(i,1)[0];o[itemDef(x.n)[1]]-=x.b;if(o.f==0)G.vault.push(x.n);if(!swap)o.loy=Math.max(0,o.loy-10)}

const recCap=c=>{const k=nowM();if(c._rm!==k){c._rm=k;c._rn=0}return Math.max(0,Math.floor(c.pop*.015)-c._rn)}; // 每城每月徵兵上限＝人口1.5% // 徵兵：民忠每15點翻倍（70=1倍、40=0.25倍、上限1.5倍）；基礎產量×0.5

// 徵兵：一品・統率100・民忠100 每次最多5000；×品級係數4^((品級-9)/9)(不入流0.25→一品1,指數)；費用＝資金×4(不入流200→一品400,線性)×2^((統率-100)/30)×2^((民忠-100)/50)；並受每月人口1.5%上限
const recYield=(o,c)=>Math.round(5000*Math.pow(4,(rk(o)-9)/9)*Math.pow(2,(cl(o.t,1,110)-100)/30)*Math.pow(2,(c.loy-100)/50));

function doRec(o,c,a){const got=recPrev(o,c,a);const rc=recCost(o);if(c.gold<rc)return`${o.n}：金不足（需${rc}），未徵兵`;if(got<1)return`${o.n}：本月徵兵已達上限（人口1.5%）或民忠不足，未徵兵`;c.gold-=rc;c.pop-=got;c._rn+=got;c.train=Math.round((c.train*c.troops+20*got)/(c.troops+got));c.troops+=got;c.loy=Math.max(0,c.loy-Math.max(1,Math.round(got/250)));o.done=true;gainExp(o,got/25);return`${o.n}（統率${o.t}・民忠${c.loy}）徵得 ${got} 兵（兵力${c.troops}）`}

const searchP=z=>cl(.4*expo(z),.05,.95); // 發現率：智力每30點翻倍（30=25%、50=40%、70=63%、90+=95%）
const nowM=()=>G.year*12+G.month;
function doSearch(o,c){o.done=true;const hid=G.offs.filter(x=>x.st=="hidden"&&x.c==c.id&&!x.dead).sort((a,b)=>(b.t+b.w+b.z+b.p+b.m)-(a.t+a.w+a.z+a.p+a.m));
 const zt=`（智力${o.z}）`;if(hid.length&&R()<Math.min(.98,searchP(o.z)*fame(o.f))){const h=hid[0];h.st="free";h.foundAt=nowM();gainExp(o,30);return`${o.n}${zt} 發現在野武將 <b class="newf">${h.n}</b>（統${h.t} 武${h.w} 智${h.z} 政${h.p} 魅${h.m}），可「登用」`}

const QMAX=5;
function tacOK(B,u,n){const T=TAC[n];if(T.k!="智"&&T.k!=u.ty)return false;if(T.def&&u.side!="D")return false;if(u.o.pseudo&&T.k=="智")return false;if(n=="疾馳"&&u.dash)return false;return u.o[T.need[0]]>=T.need[1]}
function makeBattle(af,from,to,aoffs,atroops,atypes,afood){const df=to.f;let doffs=offsIn(to.id,df<0?undefined:df).filter(o=>o.f==df);doffs=[...doffs].sort((a,b)=>b.t-a.t).slice(0,5);
 if(!doffs.length)doffs=[{id:-1,n:"守備隊",t:50,w:50,z:40,p:40,m:40,f:df,pseudo:1}];
 const B={af,df,turn:1,max:30,units:[],log:[],defMult:defMultOf(to.def),cityDef:to.def,atkPen:.9,foodA:afood==null?Math.ceil(atroops/5):afood,foodD:to.food,trA:1+(from.train)/200,trD:1+(to.train)/200,cells:[]};

const alive=(B,s)=>B.units.filter(u=>u.troops>0&&(!s||u.side==s));

const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);

function reach(B,u){const mv=TY[u.ty].mv;const best=new Map([[u.x+","+u.y,0]]);const q=[[u.x,u.y,0]];while(q.length){q.sort((a,b)=>a[2]-b[2]);const [x,y,c]=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=BW||ny>=BH||uAt(B,nx,ny))return;const nc=c+mvCost(u.ty,B.cells[ny*BW+nx]);if(nc>mv)return;const k=nx+","+ny;if(best.has(k)&&best.get(k)<=nc)return;best.set(k,nc);q.push([nx,ny,nc])})}return[...best.keys()].map(k=>k.split(",").map(Number))}
// 傷害主要取決於統率，武力影響較小
function power(B,u){return(u.o.t*.85+u.o.w*.15)*(u.side=="A"?B.trA:B.trD)}
function dmgOf(B,a,d,k){let v=a.troops*.12*power(B,a)/(d.o.t*.7+35)*(.85+R()*.3)*k*ctr(a.ty,d.ty);if(a.side=="A")v*=B.atkPen;if(d.side=="D")v/=B.defMult;v*=terAtk(a.ty,B.cells[a.y*BW+a.x])*terDef(B.cells[d.y*BW+d.x]);

function bAttack(B,a,d,noCounter){const v=hit(B,a,d,dmgOf(B,a,d,1));let msg=`${TY[a.ty].ic}${a.o.n} 攻擊 ${TY[d.ty].ic}${d.o.n}，損傷 ${v}`;const m=ctr(a.ty,d.ty);if(m!=1)msg+=m>1?"（相剋！）":"（被剋）";
 if(d.troops>0&&!noCounter&&inRange(d,a)){let c=Math.round(dmgOf(B,d,a,1)*.4*(d.fx.spear&&a.ty=="騎"?2:1));c=hit(B,d,a,c);msg+=`，反擊 ${c}`}if(d.troops<=0)msg+=`。${d.o.n} 部隊潰散！`;B.log.unshift(msg);return msg}
function useTac(B,a,n,d){const T=TAC[n];a.q-=T.c;let msg;const ok=p=>R()<cl(p,.15,.95);
 const uSucc=d?.55+(a.o.t-d.o.t)/100:1,zSucc=d?.45+(a.o.z-d.o.z)/90:1;const nm=`${a.o.n}【${n}】`;
 if(n=="突擊"){if(ok(uSucc)){const v=hit(B,a,d,dmgOf(B,a,d,1.8));msg=`${nm} 重創 ${d.o.n} ${v}`}else{bAttack(B,a,d);msg=`${nm} 被擋下，轉為普通攻擊`}}
 else if(n=="衝陣"){if(ok(uSucc)){const v=hit(B,a,d,dmgOf(B,a,d,1.2));const nx=d.x+Math.sign(d.x-a.x),ny=d.y+Math.sign(d.y-a.y);if(nx>=0&&ny>=0&&nx<BW&&ny<BH&&!uAt(B,nx,ny)){d.x=nx;d.y=ny}if(R()<a.o.t/200)d.stun=1;msg=`${nm} 衝散 ${d.o.n}，損傷 ${v}${d.stun?"，陷入混亂":""}`}else msg=`${nm} 失敗`}

function tick(B,s){foodTick(B,s);alive(B,s).forEach(u=>{u.q=Math.min(QMAX,u.q+1);const f=u.fx;f.spear=0;["guard","rage","cheer"].forEach(k=>{if(f[k])f[k]--});if(f.burn){f.burn--;const v=Math.min(u.troops,f.burnV);u.troops-=v;fx(B,u,"🔥"+v);B.log.unshift(`${u.o.n} 燃燒損失 ${v}`)}u.dash=0})}
function bDuel(B,a,d){const lines=[];if(d.o.w<a.o.w-12&&R()<.6){lines.push(`${d.o.n}：「匹夫之勇，不足掛齒！」（拒絕單挑）`);B.log.unshift(lines[0]);return{lines,res:0}}
 let ha=100,hd=100;lines.push(`${a.o.n}：「${d.o.n}，可敢與我一戰！」`);for(let r=1;r<=12&&ha>0&&hd>0;r++){const x=Math.round(ri(4,12)*a.o.w/d.o.w*(R()<.12?2:1)),y=Math.round(ri(4,12)*d.o.w/a.o.w*(R()<.12?2:1));hd-=x;ha-=y;lines.push(`第${r}回合：${a.o.n}(${Math.max(0,ha)}) ⚔ ${d.o.n}(${Math.max(0,hd)})`)}
 let res=0;if(hd<=0&&hd<ha){res=1;d.troops=0;d.duelLost=1;lines.push(`${a.o.n} 勝！${d.o.n} 敗走，部隊潰散！`)}else if(ha<=0){res=-1;a.troops=0;a.duelLost=1;lines.push(`${d.o.n} 勝！${a.o.n} 敗走，部隊潰散！`)}else lines.push("勝負未分，各自收兵。");B.log.unshift(lines[lines.length-1]);return{lines,res}}
function bEnd(B){if(!alive(B,"A").length)return"D";if(!alive(B,"D").length)return"A";if(B.turn>B.max)return"D";return null}

 let r=null;const tgtOf=()=>foes().sort((a,b)=>dist(u,a)-dist(u,b)||a.troops-b.troops)[0];

const BGM=(()=>{let ctx=null,master=null,cur=null,timer=null,scene="map",on=localStorage.getItem("sango_mus")!=="0";
 const PENTA=[0,2,4,7,9];const hz=(n)=>220*Math.pow(2,n/12);
 function pluck(t,f,v,dest,dec=1.2){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type="triangle";o2.type="sawtooth";o.frequency.value=f;o2.frequency.value=f*2.001;lp.type="lowpass";lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*1.5,t+dec);const g2=ctx.createGain();g2.gain.value=.25;o2.connect(g2).connect(lp);o.connect(lp);lp.connect(g).connect(dest);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0005,t+dec);o.start(t);o2.start(t);o.stop(t+dec+.05);o2.stop(t+dec+.05)}
 function drum(t,f,v,dest,dec=.35){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(f*2.2,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dec);o.connect(g).connect(dest);o.start(t);o.stop(t+dec+.05)}
 function noise(t,v,dest,dec=.08){const n=ctx.sampleRate*dec|0,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=ctx.createBufferSource(),g=ctx.createGain(),hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=2500;s.buffer=b;g.gain.value=v;s.connect(hp).connect(g).connect(dest);s.start(t)}
 function makeBus(){const g=ctx.createGain();g.gain.value=0;g.connect(master);return g}
 // 地圖：五聲音階古箏撥弦＋低音持續；戰鬥：戰鼓節奏
 function mapLoop(bus){const beat=.5;let step=0,deg=2;const dr=ctx.createOscillator(),dg=ctx.createGain();dr.type="sine";dr.frequency.value=hz(-24);dg.gain.value=.05;dr.connect(dg).connect(bus);dr.start();const dr2=ctx.createOscillator();dr2.type="sine";dr2.frequency.value=hz(-17);const dg2=ctx.createGain();dg2.gain.value=.03;dr2.connect(dg2).connect(bus);dr2.start();
  return{tick(t){if(step%16==0)pluck(t,hz(-12),.18,bus,2.5);if(Math.random()<.72){deg=cl(deg+[-2,-1,-1,1,1,2][ri(0,5)],0,9);const n=PENTA[deg%5]+12*Math.floor(deg/5);pluck(t,hz(n),.13,bus,1.4);if(Math.random()<.18)pluck(t+beat/2,hz(n+(deg%5==4?3:2)),.07,bus,.9)}step++;return beat},stop(t){dr.stop(t);dr2.stop(t)}}}
 function warLoop(bus){const beat=.24;let step=0;const pat=[1,0,0,1,0,1,0,0,1,0,1,0,1,1,0,1];
  return{tick(t){const i=step%16;if(pat[i])drum(t,i%4==0?55:70,i%4==0?.55:.32,bus);if(i%2==1)noise(t,.05,bus);if(step%32==0)pluck(t,hz(-5),.12,bus,1.6);if(step%32==16)pluck(t,hz(-3),.12,bus,1.6);if(step%8==4&&Math.random()<.5)pluck(t,hz(PENTA[ri(0,4)]+12),.08,bus,.6);step++;return beat},stop(){}}}
 let next=0;
 function sched(){if(!ctx||!cur)return;while(next<ctx.currentTime+.3){next+=cur.loop.tick(next)}}
 function play(sc){if(!ctx)return;const t=ctx.currentTime;if(cur){const old=cur;old.bus.gain.cancelScheduledValues(t);old.bus.gain.setValueAtTime(old.bus.gain.value,t);old.bus.gain.linearRampToValueAtTime(0,t+1.5);setTimeout(()=>{old.loop.stop(ctx.currentTime);old.bus.disconnect()},1700)}
  const bus=makeBus();bus.gain.linearRampToValueAtTime(sc=="war"?.9:.8,t+1.5);cur={sc,bus,loop:sc=="war"?warLoop(bus):mapLoop(bus)};next=t+.05}
 function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=on?.35:0;master.connect(ctx.destination);timer=setInterval(sched,100);play(scene)}
 function setScene(sc){if(sc==scene)return;scene=sc;if(ctx&&on)play(sc)}
 function toggle(){on=!on;localStorage.setItem("sango_mus",on?"1":"0");if(!ctx)init();if(ctx){if(ctx.state=="suspended")ctx.resume();master.gain.setTargetAtTime(on?.35:0,ctx.currentTime,.2);if(on&&(!cur||cur.sc!=scene))play(scene)}upd()}
 function upd(){const b=document.getElementById("bMus");if(b){b.textContent=on?"♪":"♪̸";b.style.opacity=on?1:.5}}
 function sfx(k){if(!ctx||!on)return;const t=ctx.currentTime;if(k=="click")pluck(t,hz(19),.06,master,.25);else if(k=="hit"){drum(t,90,.4,master,.2);noise(t,.12,master,.1)}}
 // iOS：首次觸控後才啟動
 const first=()=>{init();if(ctx&&ctx.state=="suspended")ctx.resume();removeEventListener("touchend",first);removeEventListener("click",first)};
 addEventListener("touchend",first,{passive:true});addEventListener("click",first);
 return{setScene,toggle,upd,sfx,get on(){return on},get ctx(){return ctx},get scene(){return scene}}})();
