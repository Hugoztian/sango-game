<title>三國志 · 群雄割據</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a120b;color:#f3e6c8;font-family:"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;min-height:44px;min-width:44px;border:1px solid #8a6a3a;background:linear-gradient(#5a3a1e,#3a2412);border-radius:8px;padding:6px 12px;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.4}
button.pri{background:linear-gradient(#b0302a,#701a14);border-color:#e0b060}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#2a1a0e;border-bottom:2px solid #8a6a3a;flex-wrap:wrap}
#date{font-weight:bold;color:#ffd77a;flex:1;min-width:120px}
#main{flex:1;display:flex;position:relative;min-height:0}
#mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(#3b5a3a,#203520)}
#mapc{position:absolute;left:0;top:0;transform-origin:0 0;width:1600px;height:1600px}#mapcv{position:absolute;left:0;top:0;width:1600px;height:1600px}#map{position:absolute;left:0;top:0}
#panel{background:#24170c;border-top:2px solid #8a6a3a;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (orientation:portrait){#main{flex-direction:column}#panel{max-height:48%;min-height:0}}
@media (orientation:landscape){#panel{width:min(380px,45%);border-top:0;border-left:2px solid #8a6a3a}}
#panel h2{margin:6px 10px;font-size:20px;color:#ffd77a;display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 10px;font-size:13px}
.stats div{background:#33210f;border-radius:6px;padding:4px;text-align:center}.stats b{display:block;color:#ffd77a;font-size:15px}
.cmds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 10px}
.cmds button{padding:4px 2px}

  box.innerHTML=(o.filters?`<div class="msbar">${o.filters.map(f=>`<button data-f="${f[1]}" class="${f[1]===flt?"pri":""}">${f[0]}</button>`).join("")}<span class="mscnt">${rs.length}筆</span></div>`:"")+`<div class="tw"><table class="st"><thead><tr>${cols.map((c,i)=>`<th data-k="${i}">${c.h}<span class="arw">${key===i?(dir<0?"▼":"▲"):"⇅"}</span></th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr data-r="${rows.indexOf(r)}">${cols.map(c=>`<td>${c.f?c.f(r):c.v(r)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${cols.length}">無</td></tr>`}</tbody></table></div>`+(o.hint===false?"":`<div style="font-size:12px;opacity:.7;margin-top:4px">點欄名排序${o.onRow?"，點列查看詳情":""}</div>`);
  box.querySelectorAll("th").forEach(th=>th.onclick=e=>{e.stopPropagation();const k=+th.dataset.k;if(key===k)dir=-dir;else{key=k;dir=-1}draw()});
  box.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{flt=b.dataset.f;draw()});
  if(o.onRow)box.querySelectorAll("tbody tr[data-r]").forEach(tr=>tr.onclick=()=>o.onRow(rows[+tr.dataset.r]))};
 draw();return box}

function sortBar(get,apply,init){let key=init??null,dir=-1;const bar=document.createElement("div");bar.className="msbar sbar";
 const draw=()=>{bar.innerHTML=OSORT.map((x,i)=>`<button data-s="${i}" class="${key===i?"pri":""}">${x[0]}${key===i?(dir<0?"▼":"▲"):""}</button>`).join("");bar.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();const k=+b.dataset.s;if(key===k)dir=-dir;else{key=k;dir=-1}draw();run()})};

 draw();return bar}

function syncPosts(){if(!G)return;G.cities.forEach(c=>{if(c.f<0){c.shuai=null;c.shi=null;c.bie=null;return}
  const lord=O(G.factions[c.f].lord);if(lord&&!lord.dead&&lord.st=="serve"&&lord.c==c.id)c.shuai=lord.id; /* 主公所在＝太守 */
  else if(c.shuai!=null){const o=O(c.shuai);if(!o||o.dead||o.f!=c.f||o.c!=c.id||o.st!="serve")c.shuai=null}
  if(c.shi!=null){const o=O(c.shi);if(!o||o.dead||o.f!=c.f||o.c!=c.id||o.st!="serve"||c.shi===c.shuai||c.shi===c.bie)c.shi=null}
  if(c.bie!=null){const o=O(c.bie);if(!o||o.dead||o.f!=c.f||o.c!=c.id||o.st!="serve"||c.bie===c.shuai||c.bie===c.shi)c.bie=null}})}

const getShi=c=>{if(!c||c.f<0)return null;const o=c.shi!=null?O(c.shi):null;return o&&!o.dead&&o.f==c.f&&o.c==c.id&&o.st=="serve"?o:null};
const getBie=c=>{if(!c||c.f<0)return null;const o=c.bie!=null?O(c.bie):null;return o&&!o.dead&&o.f==c.f&&o.c==c.id&&o.st=="serve"?o:null}; /* 別駕（政→農商上限） */
const shiZ=c=>{const o=getShi(c);return o?o.z:40};
async function appointPost(c,role){ /* role: shuai太守|shi軍師|bie別駕 */syncPosts();
  const nm={shuai:"太守",shi:"軍師",bie:"別駕"};
  if(role=="shuai"){const lord=O(G.factions[c.f].lord);if(lord&&lord.c==c.id&&lord.st=="serve"&&!lord.dead)return toast("主公坐鎮，即為太守，無需改任")}
  const taken=new Set([c.shuai,c.shi,c.bie].filter(x=>x!=null));
  const cur=role=="shuai"?c.shuai:role=="shi"?c.shi:c.bie;
  const os=offsIn(c.id,c.f).filter(o=>o.id===cur||!taken.has(o.id)); /* 三職互斥 */
  const opts=[{label:"（撤銷）",v:"clear"},...os.map(o=>({label:o.n+(isLord(o)?"👑":""),sub:`統${o.t} 武${o.w} 智${o.z} 政${o.p}`+(o.id==cur?"・現任":""),v:o.id}))];
  const v=await pick(`任命${nm[role]}（${c.n}）`,opts);if(v==null)return;
  if(v=="clear"){if(role=="shuai")c.shuai=null;else if(role=="shi")c.shi=null;else c.bie=null;toast("已撤銷");renderPanel();return}
  if(role=="shuai")c.shuai=v;else if(role=="shi")c.shi=v;else c.bie=v;
  toast(`${O(v).n} 任${c.n}${nm[role]}`);renderPanel()}
