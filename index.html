<title>三國志 · 群雄割據</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a120b;color:#f3e6c8;font-family:"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;min-height:44px;min-width:44px;border:1px solid #8a6a3a;background:linear-gradient(#5a3a1e,#3a2412);border-radius:8px;padding:6px 12px;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.4}
button.pri{background:linear-gradient(#b0302a,#701a14);border-color:#e0b060}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#2a1a0e;border-bottom:2px solid #8a6a3a;flex-wrap:wrap}
#date{font-weight:bold;color:#ffd77a;flex:1;min-width:120px}
#main{flex:1;display:flex;position:relative;min-height:0}
#mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(#3b5a3a,#203520)}
#map{position:absolute;left:0;top:0;transform-origin:0 0}
#panel{background:#24170c;border-top:2px solid #8a6a3a;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (orientation:portrait){#main{flex-direction:column}#panel{max-height:48%;min-height:0}}
@media (orientation:landscape){#panel{width:min(380px,45%);border-top:0;border-left:2px solid #8a6a3a}}
#panel h2{margin:6px 10px;font-size:20px;color:#ffd77a;display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 10px;font-size:13px}
.stats div{background:#33210f;border-radius:6px;padding:4px;text-align:center}.stats b{display:block;color:#ffd77a;font-size:15px}
.cmds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 10px}
.cmds button{padding:4px 2px}
.olist{padding:0 10px 10px}
.orow{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid #3a2a18;font-size:13px;min-height:44px}
.orow .nm{font-weight:bold;width:64px;font-size:15px}.orow.done{opacity:.5}

function bDuel(B,a,d){const lines=[];if(d.o.w<a.o.w-12&&R()<.6){lines.push(`${d.o.n}：「匹夫之勇，不足掛齒！」（拒絕單挑）`);B.log.unshift(lines[0]);return{lines,res:0}}

function bEnd(B){if(!alive(B,"A").length)return"D";if(!alive(B,"D").length)return"A";if(B.turn>B.max)return"D";return null}
function aiUnit(B,u){if(u.troops<=0)return null;if(u.stun){u.stun--;return null}const foes=alive(B,u.side=="A"?"D":"A");if(!foes.length)return null;

 if(w=="A"){const allDef=offsIn(to.id).filter(o=>o.f==df);to.f=af;to.troops=remA;to.loy=Math.max(10,to.loy-10);to.gold=Math.floor(to.gold*.7);aoffs.forEach(o=>o.c=to.id);

async function handleCaptive(o,by){const of=o.f;if(by==0){const lord=O(G.factions[0].lord);let can=true;while(true){const v=await modal("俘虜處置",`俘虜了 <b>${o.n}</b>（${fname(of)}${isLord(o)?"君主":""}）<br>統${o.t} 武${o.w} 智${o.z} 政${o.p} 魅${o.m} 忠${o.loy}`,[...(can?[{t:"登用",v:1,cls:"pri"}]:[]),{t:"釋放",v:2},{t:"斬首",v:3}]);

function destroy(f){const F=G.factions[f];if(!F.alive)return;F.alive=false;facCities(f).forEach(c=>c.f=-1);G.offs.filter(o=>!o.dead&&o.f==f).forEach(o=>{if(o.st=="captive")return;o.f=-1;o.st="free"});logMsg(`${F.n}勢力滅亡`)}

 for(const o of os){const r=R();if(c.troops<Math.min(c.pop/15,6000+c.com*15)&&c.gold>300&&r<.5){const a=2000;c.gold-=a/10;c.troops+=Math.round(a*(1+o.m/250));c.pop-=a;c.loy=Math.max(0,c.loy-4)}

 if(os.length>=1&&G.month+G.year*12>190*12+2&&R()<.33){const tg=adj(c.id).map(C).filter(t=>t.f!=f).sort((a,b)=>a.troops*(1+a.def/1000)-b.troops*(1+b.def/1000))[0];
